# Blog Nginx reverse proxy configuration
# Copy to: /etc/nginx/sites-available/blog-service
# Enable: sudo ln -s /etc/nginx/sites-available/blog-service /etc/nginx/sites-enabled
# Replace: 'blog-service.example.com' with your actual domain

# Upstream application server (gunicorn)
# Gunicorn listens of localhost:8000 only; not exposed to the internet
upstream blog_app {
    server 127.0.0.1:8000;
}

# HTTP server block
# Listens on port 80 (HTTP)
# When using SSL, this block can redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;

    # Replace 'blog-service.example.com' with your actual domain
    server_name blog-service.example.com;

    # Optional: Redirect HTTP to HTTPS after setting up SSL with certbot
    # Uncomment the line below after running: sudo certbot --nginx -d blog-service.example.com
    # return 301 https://$server_name$request_uri

    # Root proxy location
    # All requests are proxied to the gunicorn backend
    location / {
        # Pass request to upstream gunicorn server
        proxy_pass http://blog_app;

        # Set the host header so Flask knows the original domain
        proxy_set_header Host $host;

        # Set the client's real IP address (not nginx's IP)
        proxy_set_header X-Real-IP $remote_addr;

        # List of all IP addresses in the proxy chain (important for security)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Original scheme (http or https) for proper redirect handling
        proxy_set_header X-Forwarded-Proto $scheme;

        # Original server nam
        proxy_set_header X-Forwarded-Host $server_name;

        # Optional: set connection timeout and buffer settings
        # These may need tuning based on your host's resources and traffic patterns
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer requests/responses to prevent upstream being slowed by slow clients
        proxy_buffering on;
        proxy_buffering_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8;
    }

    # Optional: Serve static assets directly from nginx (better performance)
    # uncomment if the app is configured to serve static files from /static/
    # Note: This example skips static serving; gunicorn serves all content
    # location /static/ {
    #     alias /opt/blog/app/static/;
    #     expires 30d;
    # }

    # Optional: custom error pages
    # error_page 502 503 504 /50x.html;
    # location - /50x.html {
    #     root /usr/share/nginx/html;
    # }

    # Optional: deny access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# HTTPS server block (after SSL setup with certbot)
# Uncomment and configure after running: sudo certbot --nginx -d blog-service.example.com
#
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name blog-service.example.com;

    # SSL certificate paths (generated by certbot)
    ssl_certificate /etc/letsencrypt/live/blog-service.example.com/fullchain.pem
    ssl_certificate_key /etc/letsencrypt/live/blog-service.example.com/privkey.pem

    # Modern SSL configuration (certbot generates this)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Location block (same as http above)
    location / {
        proxy_pass http://blog_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
    }
}