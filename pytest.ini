[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = tests
adopts = -v --strict-markers
markers =
    auth: Auth-related tests
    admin: Admin-related tests
    email: Email-related tests
    posts: Posts CRUD tests
    public_blog: Public blog tests (index, detail, search, view counter)
    cicd: CI/CD integration tests (GitHub Actions, deploy script, migrations, systemd)