name: Test Suite

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Test Summary
        if: always()
        run: |
          echo "Github Actions workflow complete."
          echo "Push to main triggered this test run."
          echo "Tests must pass before cron-based deploy on server can proceed."