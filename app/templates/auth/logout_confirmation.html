{% extends "base.html" %}

{% block title %}Sign Out - Blog Admin{% endblock %}

{% block content %}
<div class="logout-container">
    <div class="logout-card">
        <h1 class="logout-title">Sign Out?</h1>
        <p>Are you sure you want to sign out?</p>

        <div class="logout-actions">
            <form method="POST" action="{{ url_for('auth.logout') }}" style="display: inline;">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit" class="btn btn-destructive">Sign Out</button>
            </form>
            <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </div>
</div>
{% endblock %}
