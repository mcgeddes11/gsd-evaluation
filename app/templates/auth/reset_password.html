{% extends "base.html" %}

{% block title %}Sign In - Blog Admin{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <h1 class="login-title">Set New Password</h1>
        <p style="color: #666666; font-size: 14px; margin-bottom: 24px;">
            Enter your new password below. Link expires in 24 hours.
        </p>

        <form method="POST" class="login-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="password">New password<abbr title="required">*</abbr></label>
                <input
                    id="password"
                    type="password"
                    name="password"
                    required
                    autofocus
                    class="form-input"
                    minlength="8"
                />
                <small class="form-help">At least 8 characters</small>
            </div>

            <div class="form-group">
                <label for="password_confirm">Confirm password<abbr title="required">*</abbr></label>
                <input
                    id="password_confirm"
                    type="password"
                    name="password_confirm"
                    required
                    class="form-input"
                    minlength="8"
                />
            </div>

            <button type="submit" class="btn btn-primary btn-full-width">Set new password</button>
        </form>

        <div class="login-footer">
            <a href="{{ url_for('auth.forgot_password') }}" class="link-secondary">Request new link</a>
        </div>
    </div>
</div>
{% endblock %}
