{% extends "base.html" %}

{% block title %}Password Reset - Blog Admin{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <h1 class="login-title">Reset Password</h1>
        <p style="color: #666666; font-size: 14px; margin-bottom: 24px;">
            Enter your email address and we'll send you a link to reset your password.
        </p>

        <form method="POST" class="login-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="email">Email Address<abbr title="required">*</abbr></label>
                <input
                    id="email"
                    type="email"
                    name="email"
                    required
                    autofocus
                    class="form-input"
                />
            </div>
            <button type="submit" class="btn btn-primary btn-full-width">Send Reset Link</button>
        </form>

        <div class="login-footer">
            <a href="{{ url_for('auth.login') }}" class="link-secondary">Back to sign in</a>
        </div>
    </div>
</div>
{% endblock %}
